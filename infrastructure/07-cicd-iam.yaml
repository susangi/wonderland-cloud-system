AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Wonderland CI/CD access. GitHub Actions logs in to AWS with OIDC (no long lived keys),
  pushes images to ECR and updates the EKS cluster.

Parameters:
  GitHubOwner:
    Type: String
    Default: susangi
    Description: GitHub user name that owns the repository
  GitHubRepo:
    Type: String
    Default: wonderland-cloud-system
  ClusterName:
    Type: String
    Default: wonderland-eks

Resources:
  # Tells AWS to trust tokens issued by GitHub Actions.
  # Only one provider per URL is allowed in an account.
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  # The role GitHub Actions takes. Only the main branch of our repo can use it.
  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: wonderland-github-actions
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              # GitHub can send the subject in two formats. The new one adds the owner and repo IDs,
              # for example repo:susangi@123/wonderland-cloud-system@456:ref:refs/heads/main.
              # Both formats allow only the main branch of our repository.
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubOwner}/${GitHubRepo}:ref:refs/heads/main
                  - !Sub repo:${GitHubOwner}@*/${GitHubRepo}@*:ref:refs/heads/main
      Policies:
        - PolicyName: wonderland-ci-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Login to ECR. This action does not support a resource limit.
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              # Push images only to our 5 repositories.
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                Resource: !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/wonderland/*
              # Needed for "aws eks update-kubeconfig".
              - Effect: Allow
                Action: eks:DescribeCluster
                Resource: !Sub arn:aws:eks:${AWS::Region}:${AWS::AccountId}:cluster/${ClusterName}

  # Lets the GitHub role run kubectl on the cluster (EKS access entry, API auth mode).
  GitHubActionsAccessEntry:
    Type: AWS::EKS::AccessEntry
    Properties:
      ClusterName: !Ref ClusterName
      PrincipalArn: !GetAtt GitHubActionsRole.Arn
      Type: STANDARD
      AccessPolicies:
        - PolicyArn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy
          AccessScope:
            Type: cluster

Outputs:
  GitHubRoleArn:
    Description: Put this in the GitHub repo secret AWS_ROLE_ARN
    Value: !GetAtt GitHubActionsRole.Arn
    Export:
      Name: wonderland-GitHubRoleArn
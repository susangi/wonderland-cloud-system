# Local development stack.
# For now only MySQL runs in Docker. The Laravel services run with "php artisan serve"
# (see docs/05-local-development.md). The full container stack (services + gateway) is added in Phase 6.

services:
  mysql:
    image: mysql:8.4
    container_name: wonderland-mysql
    # Metabase's driver cannot use MySQL 8's default password method without SSL,
    # so we allow the older method for the read only Metabase user only (local).
    command: --mysql-native-password=ON
    environment:
      # Local only password. Cloud passwords come from Secrets Manager, never from this file.
      MYSQL_ROOT_PASSWORD: root
      # Store times in UTC, same as RDS. The frontend and Metabase show Asia/Colombo time.
      TZ: UTC
    ports:
      # XAMPP MySQL already uses 3306 on the laptop, so Docker MySQL uses 3307.
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # Creates the six schemas the first time the volume is empty.
      - ./scripts/local-db-init.sql:/docker-entrypoint-initdb.d/01-local-db-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
  metabase:
    # Metabase reads park data for the admin dashboards (FR-A-12, TR-04).
    # Exact version pinned so the demo does not change by itself.
    image: metabase/metabase:v0.61.7
    container_name: wonderland-metabase
    ports:
      - "3000:3000"
    environment:
      # Metabase keeps its own dashboards in metabase_db, so they survive a restart.
      MB_DB_TYPE: mysql
      MB_DB_HOST: mysql
      MB_DB_PORT: 3306
      MB_DB_DBNAME: metabase_db
      MB_DB_USER: root
      MB_DB_PASS: root
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  mysql-data:

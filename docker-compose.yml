# Local container stack for Wonderland (Phase 6).
# MySQL, Metabase and the five Laravel microservices run as containers.
# The React frontend still runs with "npm run dev" and its Vite proxy sends /api calls to ports 8001-8005.

# Settings shared by all five Laravel containers.
# Each service still reads its own .env (APP_KEY, DB name), these lines override
# only what is different inside Docker.
x-laravel-env: &laravel-env
  DB_HOST: mysql
  DB_PORT: "3306"
  LOG_CHANNEL: stderr

services:
  mysql:
    image: mysql:8.4
    container_name: wonderland-mysql
    # Metabase's driver cannot use MySQL 8's default password method without SSL,
    # so we allow the older method for the read only Metabase user only (local).
    command: --mysql-native-password=ON
    environment:
      # Local only password. Cloud passwords come from Secrets Manager, never from this file.
      MYSQL_ROOT_PASSWORD: root
      # Store times in UTC, same as RDS. The frontend and Metabase show Asia/Colombo time.
      TZ: UTC
    ports:
      # XAMPP MySQL already uses 3306 on the laptop, so Docker MySQL uses 3307.
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # Creates the six schemas the first time the volume is empty.
      - ./scripts/local-db-init.sql:/docker-entrypoint-initdb.d/01-local-db-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  metabase:
    # Metabase reads park data for the admin dashboards (FR-A-12, TR-04).
    # Exact version pinned so the demo does not change by itself.
    image: metabase/metabase:v0.61.7
    container_name: wonderland-metabase
    ports:
      - "3000:3000"
    environment:
      # Metabase keeps its own dashboards in metabase_db, so they survive a restart.
      MB_DB_TYPE: mysql
      MB_DB_HOST: mysql
      MB_DB_PORT: 3306
      MB_DB_DBNAME: metabase_db
      MB_DB_USER: root
      MB_DB_PASS: root
    depends_on:
      mysql:
        condition: service_healthy

  attraction-service:
    build: ./services/attraction-service
    image: wonderland/attraction-service:local
    container_name: wonderland-attraction
    env_file: ./services/attraction-service/.env
    environment:
      <<: *laravel-env
    ports:
      - "8001:8080"
    depends_on:
      mysql:
        condition: service_healthy

  pricing-service:
    build: ./services/pricing-service
    image: wonderland/pricing-service:local
    container_name: wonderland-pricing
    env_file: ./services/pricing-service/.env
    environment:
      <<: *laravel-env
    ports:
      - "8002:8080"
    depends_on:
      mysql:
        condition: service_healthy

  booking-service:
    build: ./services/booking-service
    image: wonderland/booking-service:local
    container_name: wonderland-booking
    env_file: ./services/booking-service/.env
    environment:
      <<: *laravel-env
      # Inside Docker, services find each other by service name (service discovery).
      PRICING_URL: http://pricing-service:8080
      PAYMENT_URL: http://payment-service:8080
      EVENT_URL: http://event-service:8080
    ports:
      - "8003:8080"
    depends_on:
      mysql:
        condition: service_healthy

  # Same booking image, but runs the scheduler (outbox flush, expire bookings).
  # In Kubernetes these become CronJobs.
  booking-scheduler:
    image: wonderland/booking-service:local
    container_name: wonderland-booking-scheduler
    env_file: ./services/booking-service/.env
    environment:
      <<: *laravel-env
      PRICING_URL: http://pricing-service:8080
      PAYMENT_URL: http://payment-service:8080
      EVENT_URL: http://event-service:8080
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      - booking-service

  payment-service:
    build: ./services/payment-service
    image: wonderland/payment-service:local
    container_name: wonderland-payment
    env_file: ./services/payment-service/.env
    environment:
      <<: *laravel-env
    ports:
      - "8004:8080"
    depends_on:
      mysql:
        condition: service_healthy

  event-service:
    build: ./services/event-service
    image: wonderland/event-service:local
    container_name: wonderland-event
    env_file: ./services/event-service/.env
    environment:
      <<: *laravel-env
      ATTRACTION_URL: http://attraction-service:8080
    ports:
      - "8005:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
# ingress-nginx routes each /api path to the right service.
# /api/internal/* is not routed here, so internal endpoints cannot be reached from outside.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: attraction-ingress
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - { path: /api/attractions, pathType: Prefix, backend: { service: { name: attraction-service, port: { number: 80 } } } }
---

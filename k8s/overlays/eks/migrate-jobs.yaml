# One Job per service. Creates the tables and seed data in RDS.
# backoffLimit 6: if db-bootstrap is not finished yet, the Job tries again.
apiVersion: batch/v1
kind: Job
metadata:
  name: attraction-migrate
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 33
      containers:
        - name: migrate
          image: wonderland/attraction-service
          command: ["php", "artisan", "migrate", "--force", "--seed"]
          envFrom:
            - configMapRef: { name: wonderland-config }
            - secretRef: { name: wonderland-app-secrets }
            - secretRef: { name: attraction-db-secret }
          env:
            - { name: DB_DATABASE, value: attraction_db }

# Metabase for the admin dashboard. ClusterIP only, so it is not on the internet.
# Admins open it with kubectl port-forward.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metabase
  labels: { app: metabase }
spec:
  replicas: 1
  selector:
    matchLabels: { app: metabase }
  template:
    metadata:
      labels: { app: metabase }
    spec:
      containers:
        - name: metabase
          image: metabase/metabase:v0.61.7
          ports:
            - containerPort: 3000
          env:
            - { name: MB_DB_TYPE, value: mysql }
            - { name: MB_DB_DBNAME, value: metabase_db }
            - { name: MB_DB_PORT, value: "3306" }
            - name: MB_DB_HOST
              valueFrom: { configMapKeyRef: { name: wonderland-config, key: DB_HOST } }
            # MySQL 8.4 uses caching_sha2_password. Without TLS the driver must fetch the server public key.
            # User and password still come from MB_DB_USER and MB_DB_PASS (the secret).
            - name: MB_DB_CONNECTION_URI
              value: "mysql://$(MB_DB_HOST):3306/metabase_db?allowPublicKeyRetrieval=true"
            - { name: JAVA_OPTS, value: "-Xmx1g" }
          envFrom:
            - secretRef: { name: metabase-db-secret }   # MB_DB_USER, MB_DB_PASS
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: "1", memory: 1536Mi }
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 60
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: metabase
spec:
  selector: { app: metabase }
  ports:
    - port: 3000
      targetPort: 3000